# Fly.io app of the API, staging (EST-03.2, ADR 008). Deployed by .github/workflows/deploy-staging.yml
# with `flyctl deploy --config deploy/fly/api.toml --image registry.fly.io/trs-tax-api:<sha>`.
# Secrets (DATABASE_URL, BETTER_AUTH_SECRET, BETTER_AUTH_URL) are Fly secrets, never set here.
app = "trs-tax-api"
primary_region = "gru"

[env]
  NODE_ENV = "production"
  LOG_LEVEL = "info"
  # Fly's proxy appends the client address to X-Forwarded-For: trust exactly that one hop, so the
  # rate limits key on the real client and a client-supplied header cannot spoof it.
  TRUST_PROXY_HOPS = "1"
  # Web app (Cloudflare Workers): the only browser origin allowed by CORS, and base of e-mail links.
  WEB_URL = "https://trs-web.thausreiser.workers.dev"
  # Private engines through Flycast: the Fly proxy starts a stopped engine machine on the first call.
  ENGINE_REGIME_REGULAR_URL = "http://trs-engine-rr.flycast:8080"
  ENGINE_SIMPLES_NACIONAL_URL = "http://trs-engine-sn.flycast:8082"
  # APP_VERSION is set per deploy (`--env APP_VERSION=<git sha>`).

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
