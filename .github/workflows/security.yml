name: Security

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  schedule:
    # Mondays 06:00 BRT: catches advisories published after the last change.
    - cron: "0 9 * * 1"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  dependency-audit:
    name: Dependency audit (high and critical)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Reads pnpm-lock.yaml only, so no install is needed.
      - run: pnpm audit --audit-level high

  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # On pull requests and pushes the action scans only the new commits, whatever the fetch depth.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
          # A comment needs a write token and would point at the secret in a public thread.
          GITLEAKS_ENABLE_COMMENTS: "false"
      # The action leaves this binary on PATH. Pull requests and pushes scan the whole history of
      # the commit under test only (HEAD: develop plus the change), never other open branches, so a
      # finding on an unrelated branch cannot fail this run. The weekly run scans every branch.
      - name: Scan the full history
        env:
          LOG_OPTS: ${{ github.event_name == 'schedule' && '--all' || 'HEAD' }}
        run: gitleaks git --no-banner --redact --exit-code 1 --log-opts="$LOG_OPTS" .
