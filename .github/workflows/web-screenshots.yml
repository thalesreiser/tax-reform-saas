name: Web screenshots (temporary)

# Temporary branch-only workflow to preview the web app before preview deployments exist. Never merged.
on:
  push:
    branches: [ci/web-screenshots]

permissions:
  contents: read

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @trs/web build
      - name: Install Playwright
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.65.1 >/dev/null
          npx --prefix /tmp/pw playwright install --with-deps chromium
      - name: Take screenshots
        run: cp .screenshots/shoot.mjs /tmp/pw/shoot.mjs && node /tmp/pw/shoot.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-screenshots
          path: shots/
          retention-days: 7
