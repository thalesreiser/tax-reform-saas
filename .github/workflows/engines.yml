name: Engines

# Builds the official Receita Federal engines from the tags pinned in engines/versions.env, starts
# them with the offline profile and checks them against the upstream examples (MOT-01.1, ADR 004).
# The engines are never modified: the upstream repositories are checked out and built as they are.

on:
  pull_request:
    branches: [develop, main]
    paths: ["engines/**", ".github/workflows/engines.yml"]
  push:
    branches: [develop, main]
    paths: ["engines/**", ".github/workflows/engines.yml"]
  schedule:
    # Mondays 07:00 BRT: catches breakage outside our code (runner image, Maven Central, JDK).
    - cron: "0 10 * * 1"
  workflow_dispatch:

concurrency:
  group: engines-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  engine:
    name: Engine (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: regime-regular
            pin: REGIME_REGULAR
            jar: api-regime-geral.jar
            http-port: 8080
            mgmt-port: 9101
          - engine: simples-nacional
            pin: SIMPLES_NACIONAL
            jar: api-simples-nacional.jar
            http-port: 8082
            mgmt-port: 9103
    env:
      ENGINE_DIR: upstream/${{ matrix.engine }}
      RESULTS_FILE: ${{ github.workspace }}/results.md
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned versions
        id: pins
        run: grep -E '^[A-Z_]+=' engines/versions.env >> "$GITHUB_OUTPUT"

      - name: Check that the pinned tags still point to the pinned commits
        env:
          RR_REPO: ${{ steps.pins.outputs.REGIME_REGULAR_REPO }}
          RR_TAG: ${{ steps.pins.outputs.REGIME_REGULAR_TAG }}
          RR_SHA: ${{ steps.pins.outputs.REGIME_REGULAR_SHA }}
          SN_REPO: ${{ steps.pins.outputs.SIMPLES_NACIONAL_REPO }}
          SN_TAG: ${{ steps.pins.outputs.SIMPLES_NACIONAL_TAG }}
          SN_SHA: ${{ steps.pins.outputs.SIMPLES_NACIONAL_SHA }}
        run: |
          check() {
            # For an annotated tag the peeled line (^{}) holds the commit; it is listed last.
            actual=$(git ls-remote --tags "https://github.com/$1.git" "refs/tags/$2" "refs/tags/$2^{}" | tail -n 1 | cut -f 1)
            if [[ $actual != "$3" ]]; then
              echo "::error::$1 tag $2 points to ${actual:-nothing}, expected $3"
              exit 1
            fi
          }
          check "$RR_REPO" "$RR_TAG" "$RR_SHA"
          check "$SN_REPO" "$SN_TAG" "$SN_SHA"

      # The Simples engine has no Flyway scripts of its own: upstream tells us to use the ones in the
      # regime-regular repository, so the database is always generated from that checkout.
      - name: Check out calculadora-rtc-regime-regular ${{ steps.pins.outputs.REGIME_REGULAR_TAG }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.pins.outputs.REGIME_REGULAR_REPO }}
          ref: ${{ steps.pins.outputs.REGIME_REGULAR_SHA }}
          path: upstream/regime-regular
          persist-credentials: false

      - name: Check out calculadora-rtc-simples-nacional ${{ steps.pins.outputs.SIMPLES_NACIONAL_TAG }}
        if: matrix.engine == 'simples-nacional'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.pins.outputs.SIMPLES_NACIONAL_REPO }}
          ref: ${{ steps.pins.outputs.SIMPLES_NACIONAL_SHA }}
          path: upstream/simples-nacional
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: upstream/*/pom.xml

      - name: Summary header
        env:
          TAG: ${{ steps.pins.outputs[format('{0}_TAG', matrix.pin)] }}
          DB_TAG: ${{ steps.pins.outputs.REGIME_REGULAR_TAG }}
        run: |
          {
            echo "## ${{ matrix.engine }} $TAG"
            echo
            echo "Database generated by Flyway from calculadora-rtc-regime-regular $DB_TAG."
            echo
            java -version 2>&1 | sed 's/^/    /'
            echo
            echo "Runner: $(nproc) vCPU, $(free -m | awk '/^Mem:/ { print $2 }') MB RAM."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate the database (Flyway)
        working-directory: upstream/regime-regular
        run: |
          mkdir -p calculadora/db
          SECONDS=0
          ./mvnw --batch-mode --errors flyway:migrate -Dflyway.configFiles=./flyway/flyway-pro.conf
          size=$(du -m calculadora/db/calculadora-pro.db | cut -f 1)
          echo "- Flyway database generation: ${SECONDS}s, ${size} MB" >> "$GITHUB_STEP_SUMMARY"

      - name: Copy the database to the Simples engine
        if: matrix.engine == 'simples-nacional'
        run: |
          mkdir -p "$ENGINE_DIR/calculadora/db"
          cp upstream/regime-regular/calculadora/db/calculadora-pro.db "$ENGINE_DIR/calculadora/db/"

      # Upstream tests are skipped: they are the publisher's responsibility and the smoke test below
      # checks the built jar against the official example.
      - name: Build the jar
        working-directory: ${{ env.ENGINE_DIR }}
        run: |
          SECONDS=0
          ./mvnw --batch-mode --errors -DskipTests package
          size=$(du -m "target/${{ matrix.jar }}" | cut -f 1)
          echo "- Jar build (\`mvnw package -DskipTests\`): ${SECONDS}s, ${size} MB" >> "$GITHUB_STEP_SUMMARY"

      - name: Results table header
        run: |
          {
            echo
            echo "| Run | JVM options | Max heap (MB) | Healthy after (s) | Spring start (s) | RSS idle (MB) | RSS after load (MB) | Peak RSS (MB) | First request (ms) | Warm avg (ms) | Example |"
            echo "| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |"
          } > "$RESULTS_FILE"

      - name: Smoke test, default JVM options
        run: >-
          engines/scripts/smoke.sh "$ENGINE_DIR" ${{ matrix.jar }} ${{ matrix.http-port }}
          ${{ matrix.mgmt-port }} engines/fixtures/${{ matrix.engine }} default

      # Sizes the JVM as if it ran in a 512 MB container (the smallest plan considered for DEC-01).
      - name: Smoke test, 512 MB container sizing
        run: >-
          engines/scripts/smoke.sh "$ENGINE_DIR" ${{ matrix.jar }} ${{ matrix.http-port }}
          ${{ matrix.mgmt-port }} engines/fixtures/${{ matrix.engine }} 512m
          -XX:MaxRAM=512m -XX:MaxRAMPercentage=75 -XX:+UseSerialGC -Xss512k

      # Same sizing with C1 only and a smaller code cache: trades peak throughput for start-up and RSS.
      - name: Smoke test, 512 MB container sizing, C1 only
        run: >-
          engines/scripts/smoke.sh "$ENGINE_DIR" ${{ matrix.jar }} ${{ matrix.http-port }}
          ${{ matrix.mgmt-port }} engines/fixtures/${{ matrix.engine }} 512m-c1
          -XX:MaxRAM=512m -XX:MaxRAMPercentage=75 -XX:+UseSerialGC -Xss512k
          -XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=64m

      - name: Write the results to the job summary
        if: always()
        run: |
          if [[ -f "$RESULTS_FILE" ]]; then cat "$RESULTS_FILE" >> "$GITHUB_STEP_SUMMARY"; fi

      # Jar and database for MOT-01.2 (images) to reuse while the image build is written.
      - name: Upload the jar and the database
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-${{ matrix.engine }}-${{ steps.pins.outputs[format('{0}_TAG', matrix.pin)] }}
          path: |
            ${{ env.ENGINE_DIR }}/target/${{ matrix.jar }}
            ${{ env.ENGINE_DIR }}/calculadora/db/calculadora-pro.db
          if-no-files-found: error
          retention-days: 14

      - name: Upload the engine logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-${{ matrix.engine }}-logs
          path: |
            ${{ env.ENGINE_DIR }}/engine-*.log
            ${{ env.ENGINE_DIR }}/response-*.json
          if-no-files-found: ignore
          retention-days: 14
