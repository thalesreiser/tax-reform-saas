name: Image

# Builds the API container image, smoke-tests it and scans it (EST-02.3). Publishing to GHCR comes
# with the deploy pipeline (EST-03.2).
on:
  pull_request:
    branches: [develop, main]
    paths: &image-paths
      - apps/api/**
      - packages/*/package.json
      - .dockerignore
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - .github/workflows/image.yml
  push:
    branches: [develop, main]
    paths: *image-paths
  workflow_dispatch:

concurrency:
  group: image-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: trs-api:ci

jobs:
  image:
    name: Build, smoke test and scan the API image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          tags: ${{ env.IMAGE }}
          load: true
          push: false
          cache-from: type=gha,scope=api-image
          cache-to: type=gha,scope=api-image,mode=max

      # The database is never reached by /health (the pool connects on the first query), so an
      # unreachable URL is enough; the auth secret is random per run.
      - name: Run the container
        run: |
          docker run --detach --name api --publish 3000:3000 --env APP_VERSION=ci             --env DATABASE_URL=postgres://nobody@127.0.0.1:1/none             --env BETTER_AUTH_SECRET="$(openssl rand -hex 32)"             --env BETTER_AUTH_URL=http://127.0.0.1:3000             "$IMAGE"

      - name: Check that it runs as a non-root user
        run: |
          uid="$(docker exec api id -u)"
          echo "uid=$uid"
          test "$uid" != "0"

      - name: Smoke test GET /health
        run: |
          for _ in $(seq 1 30); do
            if curl --silent --fail --output /tmp/health.json http://127.0.0.1:3000/health; then
              break
            fi
            sleep 1
          done
          cat /tmp/health.json
          jq --exit-status '.status == "ok" and .version == "ci"' /tmp/health.json

      - name: Wait for the Docker health check
        run: |
          for _ in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' api)"
            echo "health=$status"
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Container logs
        if: always()
        run: docker logs api || true

      - name: Report high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          severity: HIGH,CRITICAL
          format: table
          exit-code: "0"

      - name: Fail on critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          severity: CRITICAL
          format: table
          exit-code: "1"
          skip-setup-trivy: true
