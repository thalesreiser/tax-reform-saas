packages:
  - "apps/*"
  - "packages/*"

# One version per dependency for the whole monorepo; packages reference it as "catalog:".
catalog:
  "@commitlint/cli": 21.2.4
  "@commitlint/config-conventional": 21.2.4
  "@eslint/js": 10.0.1
  "@fastify/rate-limit": 11.3.0
  "@fastify/swagger": 9.9.5
  "@fontsource-variable/outfit": 5.3.0
  "@iconify-json/lucide": 1.2.158
  "@nuxt/test-utils": 4.4.0
  "@nuxt/ui": 4.13.0
  "@nuxtjs/i18n": 10.6.0
  "@types/node": 24.19.2
  "@types/pg": 8.23.1
  "@vue/test-utils": 2.6.0
  better-auth: 1.7.27
  decimal.js: 10.6.0
  drizzle-kit: 0.31.11
  drizzle-orm: 0.45.4
  eslint: 10.15.0
  eslint-config-prettier: 10.1.8
  eslint-plugin-vue: 10.12.1
  fastify: 5.12.8
  fastify-type-provider-zod: 7.0.0
  globals: 17.14.0
  happy-dom: 21.0.4
  husky: 9.1.7
  lint-staged: 17.6.1
  nuxt: 4.6.4
  openapi-fetch: 0.17.0
  openapi-types: 12.1.3
  openapi-typescript: 7.13.0
  pg: 8.23.1
  prettier: 3.10.1
  tailwindcss: 4.3.5
  turbo: 2.11.13
  typescript: 5.9.3
  typescript-eslint: 8.73.0
  vitest: 5.1.1
  vue: 3.5.46
  vue-router: 5.5.1
  vue-tsc: 3.3.14
  zod: 4.6.7

engineStrict: true

# Packages allowed to run install scripts (pnpm 10 blocks them by default).
onlyBuiltDependencies:
  - esbuild
